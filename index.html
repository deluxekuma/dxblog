<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBFE">
<title>我的部落格</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-bar">
  <button class="icon-btn" type="button" aria-label="選單">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <h1 class="brand">我的部落格</h1>
  <button class="icon-btn" id="themeToggle" type="button" aria-label="切換主題">
    <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A5.39 5.39 0 0 1 12 3z"/></svg>
  </button>
</header>

<main class="content">

  <section class="hero card filled">
    <p class="hero-label">最近更新</p>
    <h2 class="hero-title">歡迎來到我的小站</h2>
    <p class="hero-sub">這裡記錄我折騰伺服器、音遊和各種電子設備的日常。</p>
    <button class="btn filled" type="button">開始閱讀</button>
  </section>

  <nav class="chips" aria-label="分類">
    <button class="chip selected" type="button">全部</button>
    <button class="chip" type="button">技術</button>
    <button class="chip" type="button">音遊</button>
    <button class="chip" type="button">日常</button>
  </nav>

  <section class="post-list">

    <article class="post card">
      <div class="post-thumb tone-1"></div>
      <div class="post-body">
        <span class="post-tag">技術</span>
        <h3 class="post-title">在 Termux 裡跑 Minecraft 伺服器</h3>
        <p class="post-excerpt">把 Paper 伺服器塞進手機的嘗試，以及那些踩過的坑。</p>
        <div class="post-meta">
          <span>2026-09-12</span>
          <span class="dot"></span>
          <span>5 分鐘</span>
        </div>
      </div>
    </article>

    <article class="post card">
      <div class="post-thumb tone-2"></div>
      <div class="post-body">
        <span class="post-tag">音遊</span>
        <h3 class="post-title">自製譜面轉進 maimai DX</h3>
        <p class="post-excerpt">從 Simai 到 ACB／AWB，記錄一次完整的轉換流程。</p>
        <div class="post-meta">
          <span>2026-09-13</span>
          <span class="dot"></span>
          <span>8 分鐘</span>
        </div>
      </div>
    </article>

    <article class="post card">
      <div class="post-thumb tone-3"></div>
      <div class="post-body">
        <span class="post-tag">日常</span>
        <h3 class="post-title">九江的週末</h3>
        <p class="post-excerpt">關於這座城市的一些零碎片段。</p>
        <div class="post-meta">
          <span>2026-09-10</span>
          <span class="dot"></span>
          <span>3 分鐘</span>
        </div>
      </div>
    </article>

  </section>
</main>

<nav class="bottom-nav" aria-label="底部導航">
  <button class="nav-item active" type="button" data-page="home">
    <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>
    <span class="nav-label">首頁</span>
  </button>
  <button class="nav-item" type="button" data-page="explore">
    <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/></svg></span>
    <span class="nav-label">探索</span>
  </button>
  <button class="nav-item" type="button" data-page="favorite">
    <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.5A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6.5C19 16.65 12 21 12 21z"/></svg></span>
    <span class="nav-label">收藏</span>
  </button>
  <button class="nav-item" type="button" data-page="me">
    <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5C21 16.5 17 14 12 14z"/></svg></span>
    <span class="nav-label">我的</span>
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
